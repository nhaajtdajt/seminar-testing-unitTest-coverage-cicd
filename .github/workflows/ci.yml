name: Seminar CI
# Tự động chạy khi có pull request và khi push vào nhánh làm việc chính.
# Vẫn chạy tay được: tab Actions -> Seminar CI -> Run workflow.
on:
  push:
    branches: [master, seminar-core]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ai-tools:
    name: AI tooling offline checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/tests -v
  test:
    name: test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Chỉ JDK 25 (theo quyết định của nhóm). Muốn thêm JDK 21: java: ['21', '25']
        java: ['25']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: case-study/pom.xml
      - run: case-study/mvnw -B -ntp -f case-study/pom.xml -Djava.version=${{ matrix.java }} clean test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-jdk-${{ matrix.java }}
          path: case-study/target/surefire-reports
  coverage-gate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: case-study/pom.xml
      - run: case-study/mvnw -B -ntp -f case-study/pom.xml clean verify
      - name: Summary
        if: always()
        run: |
          echo '## Coverage gate' >> "$GITHUB_STEP_SUMMARY"
          echo 'FineCalculator: branch coverage >= 90%. See JaCoCo artifact and Maven log.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: case-study/target/site/jacoco
  package:
    needs: coverage-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: case-study/pom.xml
      # Test/gate have passed in earlier jobs; this job only packages the same revision.
      - run: case-study/mvnw -B -ntp -f case-study/pom.xml -DskipTests package
      - uses: actions/upload-artifact@v7
        with:
          name: library-app
          path: case-study/target/*.jar
  ai-review:
    name: Gemini diff review (advisory)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No needs: this lane runs alongside test/coverage, including when they fail.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Run trusted automation, never execute PR scripts with the API key.
          ref: ${{ vars.AI_REVIEW_REF || 'seminar-core' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Review PR diff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'gemini-3.6-flash' }}
        run: python3 scripts/ci_ai_review.py review
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-review
          path: .ai-work/ci-review
          retention-days: 1
          overwrite: true
  ai-comment:
    name: AI review and CI summary
    needs: [test, coverage-gate, package, ai-review]
    # Required after failed/skipped dependencies; a red gate must still get a comment.
    if: always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ vars.AI_REVIEW_REF || 'seminar-core' }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ai-review
          path: .ai-work/ci-artifacts/ai-review
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: tests-jdk-25
          path: .ai-work/ci-artifacts/tests-jdk-25
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: coverage
          path: .ai-work/ci-artifacts/coverage
      - name: Update PR comment with measured results and Gemini findings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: python3 scripts/ci_ai_review.py comment
